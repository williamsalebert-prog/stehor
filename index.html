<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#120e0b" />
  <title>Sethoria Atlas — Prototipo A3.3</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar" aria-label="Navegación principal">

      <!-- Inicio y control de tamaño forman una sola pieza visual.
           El control está debajo de la S, no en una barra superior. -->
      <div class="home-control">
        <button id="brandHome" class="home-button" title="Inicio" aria-label="Ir al inicio">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span class="home-copy">
            <strong>Inicio</strong>
            <small>Sethoria Atlas</small>
          </span>
        </button>
        <button id="sidebarResizeBtn" class="resize-under-s" title="Expandir o contraer menú lateral" aria-label="Expandir o contraer menú lateral">
          <span aria-hidden="true">⇔</span>
        </button>
      </div>

      <nav id="categoryNav" class="category-nav" aria-label="Categorías"></nav>

      <div class="sidebar-tools">
        <div class="sidebar-title">Herramientas</div>
        <button id="registryBtn" class="nav-button" data-nav="registry" title="Registro maestro">
          <span class="nav-icon">⌗</span><span class="nav-label">Registro maestro</span>
        </button>
        <button id="linkerBtn" class="nav-button" data-nav="linker" title="Hipervinculador">
          <span class="nav-icon">↗</span><span class="nav-label">Hipervinculador</span>
        </button>
      </div>

      <div class="sidebar-footer">
        <button id="exportBtn" class="icon-action" title="Exportar respaldo" aria-label="Exportar respaldo">⇩</button>
        <label class="icon-action file-label" title="Importar respaldo" aria-label="Importar respaldo">
          ⇧
          <input id="importInput" type="file" accept=".json,application/json" hidden />
        </label>
      </div>
    </aside>

    <main class="main">
      <section id="view"></section>
    </main>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="data/demo-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
